name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    # A hung test used to take the job to forty minutes before the runner gave
    # up. Fifteen is generous for a suite that runs in eleven seconds locally.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      # The app bundle is the only artifact anyone can actually run, so the
      # script that assembles it is covered here too rather than only at
      # release time, where a break is expensive.
      - name: Build the app bundle
        run: ./Scripts/build_app.sh

      - name: Check the bundle is universal and launchable
        run: |
          lipo -archs build/Forge.app/Contents/MacOS/Forge | tee /tmp/archs
          grep -q arm64 /tmp/archs
          grep -q x86_64 /tmp/archs
          test -f build/Forge.app/Contents/Info.plist
          codesign --verify --verbose=1 build/Forge.app

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: Forge-app
          path: build/Forge.app
